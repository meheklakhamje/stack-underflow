<article class="py-6">

    <div class="flex flex-col gap-5 sm:flex-row">

        <!-- Question Statistics -->
        <div class="flex shrink-0 gap-4 text-sm text-slate-500 sm:w-28 sm:flex-col sm:gap-2 sm:text-right">

            <span>
                <strong class="font-semibold text-slate-700">
                    {{ votes }}
                </strong>
                votes
            </span>

            <span>
                <strong class="font-semibold text-slate-700">
                    {{ answers }}
                </strong>
                answers
            </span>

            <span>
                <strong class="font-semibold text-slate-700">
                    {{ views }}
                </strong>
                views
            </span>

        </div>


        <!-- Question Content -->
        <div class="min-w-0 flex-1">

            <a
                href="#"
                class="text-lg font-semibold leading-7 text-slate-900 transition hover:text-slate-700"
            >
                {{ title }}
            </a>

            <p class="mt-2 max-w-4xl text-sm leading-6 text-slate-500">
                {{ excerpt }}
            </p>


            <!-- Tags -->
            <div class="mt-4 flex flex-wrap gap-2">

                {% if tag1 %}
                    <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">
                        {{ tag1 }}
                    </span>
                {% endif %}

                {% if tag2 %}
                    <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">
                        {{ tag2 }}
                    </span>
                {% endif %}

                {% if tag3 %}
                    <span class="rounded-md bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">
                        {{ tag3 }}
                    </span>
                {% endif %}

            </div>


            <!-- Author Information -->
            <div class="mt-4 flex flex-wrap items-center gap-1.5 text-xs text-slate-500">

                <span class="font-medium text-slate-700">
                    {{ author }}
                </span>

                <span>•</span>

                <span>
                    {{ reputation }} reputation
                </span>

                <span>•</span>

                <span>
                    {{ time }}
                </span>

            </div>

        </div>

    </div>

</article>
